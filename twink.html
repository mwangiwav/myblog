<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css"/>
    <link rel="stylesheet" href="twink.css"/>
    <title>Twinks</title>   
  
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="home.html">← back</a></p>
      <div id="playlist" class="grid-container"></div>
    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
    <script>
      const streams = [        
       { ytId: "kKFTa3zKqo8"}, 
       { ytId: "QSNt_Hx-VQ8"},
       { ytId: "HwzH1O1-y0s"},
       { ytId: "wL6JYHeKwGA"},
       { ytId: "baW3IHUcQ6o"}, 
       { ytId: "OYtdno4lH5U"},
       { ytId: "Tc_9-G4eB-k"},
       { ytId: "kbmejc94-dQ"},
       { ytId: "IimoULVIJlI"},
       { ytId: "ZQEAaORy5Ew"}, 
       { ytId: "pefljevaVB4"}, 
       { ytId: "LES8OL04SZQ"}, 
       { ytId: "Sg_dnoaS4gM"}, 
       { ytId: "-uhDIAu0AEI"}, 
       { ytId: "RlsIo-55l0g"}, 
       { ytId: "qRg39xbNPS4"}, 
       { ytId: "LK5Doeg3ep8"},    
      ];

      const playlist = document.getElementById("playlist");
 
      streams.forEach((stream) => {
        const item = document.createElement("a");
        item.className = "poster-wrap"; 
        item.href = `https://youtube.com{stream.ytId}`;
        item.target = "_blank";
        
        const thumbUrl = `https://youtube.com{stream.ytId}/hqdefault.jpg`;
        
        item.innerHTML = `<img src="${thumbUrl}" alt="Video thumbnail"/>`;
        playlist.appendChild(item);
      });
    </script>
  </body>
</html>
