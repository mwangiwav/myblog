<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>films - mwangi's blog</title>
  <style>
    @font-face {
      font-family: "Pixelated MS Sans Serif";
      src: url(https://unpkg.com/98.css@0.1.16/dist/ms_sans_serif.woff) format("woff");
      src: url(https://unpkg.com/98.css@0.1.16/dist/ms_sans_serif.woff2) format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Pixelated MS Sans Serif";
      src: url(https://unpkg.com/98.css@0.1.16/dist/ms_sans_serif_bold.woff) format("woff");
      src: url(https://unpkg.com/98.css@0.1.16/dist/ms_sans_serif_bold.woff2) format("woff2");
      font-weight: 700;
      font-style: normal;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    ::-webkit-scrollbar { display: none; }
 
    html {
      height: 100vh;
      width: 100vw;
      cursor: url("win982.png"), default;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
 
    body {
      background-image: url("pixel-sky.gif");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      font-family: "Pixelated MS Sans Serif", Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
 
    /* MAIN WINDOW */
    #main-window {
      width: 900px;
      height: 90vh;
      position: relative;
      background: silver;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
    }
 
    /* TITLE BAR */
    #title-bar {
      background: linear-gradient(90deg, #86a1f1, #e8bfe4);
      height: 22px;
      display: flex;

      justify-content: space-between;
      padding: 0 4px;

    }
 
    .title-bar-left {
      display: flex;

    }

    }

      color: white;
      text-shadow: 1px 1px #0a0a0a;
    }
 
    .title-bar-buttons {
      display: flex;
      gap: 2px;
    }
 
    .tb-btn {
      width: 16px;
      height: 14px;
      background: silver;
      border: none;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      font-size: 9px;
      font-family: "Pixelated MS Sans Serif", Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: url("win98-pointer.png"), pointer;
    }
 
    /* MENU BAR */
    #menu-bar {
      display: flex;
      height: 20px;
      align-items: center;
      padding-left: 4px;
      box-shadow: inset 1px 1px #fff, inset -1px -1px grey;
      font-size: 12px;
    }
 
    #menu-bar span {
      padding: 2px 6px;
      cursor: url("win98-pointer.png"), pointer;
    }
 
    #menu-bar span:hover {
      background: #dfdfdf;
    }
 
    /* ADDRESS BAR */
    #address-bar {
      display: flex;
      align-items: center;
      height: 26px;
      padding: 2px 5px;
      gap: 5px;
      box-shadow: inset 1px 1px #fff, inset -1px -1px grey;
      font-size: 12px;
      border-bottom: 1px solid #aaa;
    }
 
    #address-bar span {
      font-weight: 700;
    }
 
    #address-input {
      flex: 1;
      height: 18px;
      border: none;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      font-family: "Pixelated MS Sans Serif", Arial;
      font-size: 11px;
      padding: 0 4px;
      background: white;
    }
 
    /* CONTENT AREA */
    #content-area {
      display: flex;
      height: calc(90vh - 90px);
      overflow: hidden;
    }
 
    /* LEFT SIDEBAR */
    #sidebar {
      width: 160px;
      min-width: 160px;
      background: #d4d0c8;
      box-shadow: inset -1px 0 grey;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
 
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #00007b;
      border-bottom: 1px solid #aaa;
      padding-bottom: 3px;
      margin-bottom: 4px;
    }
 
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 2px 4px;
      cursor: url("win98-pointer.png"), pointer;
      text-decoration: none;
      color: #00007b;
    }
 
    .sidebar-item:hover {
      background: #86a1f1;
      color: white;
    }
 
    .sidebar-item img {
      width: 16px;
      height: 16px;
    }
 
    #filter-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
 
    .filter-btn {
      background: silver;
      border: none;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      font-family: "Pixelated MS Sans Serif", Arial;
      font-size: 11px;
      padding: 3px 6px;
      text-align: left;
      cursor: url("win98-pointer.png"), pointer;
      color: #222;
    }
 
    .filter-btn:hover, .filter-btn.active {
      background: #dfdfdf;
      box-shadow: inset 1px 1px #0a0a0a, inset -1px -1px #fff;
    }
 
    /* FILMS GRID */
    #films-area {
      flex: 1;
      background: white;
      overflow-y: auto;
      padding: 16px;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
    }
 
    #films-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
 
    .film-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: url("win98-pointer.png"), pointer;
      padding: 6px;
      border: 1px solid transparent;
    }
 
    .film-card:hover {
      background: #d4e4ff;
      border: 1px dotted #86a1f1;
    }
 
    .film-card.selected {
      background: #86a1f1;
      border: 1px dotted #fff;
    }
 
    .poster-wrapper {
      width: 120px;
      height: 178px;
      overflow: hidden;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      background: #c0c0c0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
 
    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
 
    .poster-placeholder {
      font-size: 10px;
      color: #666;
      text-align: center;
      padding: 8px;
    }
 
    .film-title {
      font-size: 11px;
      text-align: center;
      margin-top: 5px;
      width: 120px;
      word-break: break-word;
      color: #222;
      line-height: 1.3;
    }
 
    .film-stars {
      font-size: 13px;
      color: #DAA520;
      margin-top: 2px;
      letter-spacing: 1px;
    }
 
    /* STATUS BAR */
    #status-bar {
      height: 22px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
      font-size: 11px;
      border-top: 1px solid #aaa;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: silver;
    }
 
    .status-box {
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey;
      padding: 0 6px;
      height: 16px;
      display: flex;
      align-items: center;
    }
 
    /* POPUP MODAL */
    #popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
 
    #popup-overlay.visible {
      display: flex;
    }
 
    #popup-window {
      width: 420px;
      background: silver;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      position: relative;
    }
 
    #popup-title-bar {
      background: linear-gradient(90deg, #86a1f1, #e8bfe4);
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
 
    #popup-title-bar span {
      font-size: 12px;
      font-weight: 700;
      color: white;
      text-shadow: 1px 1px #0a0a0a;
    }
 
    #popup-close {
      width: 16px;
      height: 14px;
      background: silver;
      border: none;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      font-size: 10px;
      font-family: "Pixelated MS Sans Serif", Arial;
      cursor: url("win98-pointer.png"), pointer;
    }
 
    #popup-body {
      display: flex;
      gap: 12px;
      padding: 12px;
    }
 
    #popup-poster {
      width: 100px;
      height: 148px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
    }
 
    #popup-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
 
    #popup-film-title {
      font-size: 13px;
      font-weight: 700;
    }
 
    #popup-year {
      font-size: 11px;
      color: #666;
    }
 
    #popup-stars {
      font-size: 18px;
      color: #DAA520;
      letter-spacing: 2px;
    }
 
    #popup-overview {
      font-size: 11px;
      line-height: 1.5;
      color: #333;
      max-height: 80px;
      overflow-y: auto;
    }
 
    #popup-review-section {
      padding: 0 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
 
    #popup-review-label {
      font-size: 11px;
      font-weight: 700;
    }
 
    #popup-review-text {
      font-size: 11px;
      color: #444;
      font-style: italic;
      padding: 4px 6px;
      background: white;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      min-height: 32px;
    }
 
    #popup-review-input {
      width: 100%;
      font-family: "Pixelated MS Sans Serif", Arial;
      font-size: 11px;
      padding: 4px 6px;
      border: none;
      box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      resize: none;
      height: 50px;
      display: none;
    }
 
    #popup-btn-row {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      padding: 0 12px 10px 12px;
    }
 
    .popup-btn {
      background: silver;
      border: none;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      font-family: "Pixelated MS Sans Serif", Arial;
      font-size: 11px;
      padding: 4px 12px;
      cursor: url("win98-pointer.png"), pointer;
      min-width: 70px;
    }
 
    .popup-btn:hover {
      background: #dfdfdf;
    }
 
    /* STAR RATING SELECTOR */
    .star-selector {
      display: flex;
      gap: 3px;
      font-size: 20px;
      cursor: pointer;
    }
 
    .star-selector span {
      color: #aaa;
      cursor: url("win98-pointer.png"), pointer;
      transition: color 0.1s;
    }
 
    .star-selector span.lit {
      color: #DAA520;
    }
 
    /* LOADING SPINNER */
    .loading-text {
      font-size: 10px;
      color: #666;
      text-align: center;
      padding: 4px;
    }
 
    /* RETURN BUTTON */
    .return-button {
      display: none;
      font-size: 12px;
      padding: 4px 8px;
      background: silver;
      border: none;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
      cursor: url("win98-pointer.png"), pointer;
      font-family: "Pixelated MS Sans Serif", Arial;
    }
 
    @media screen and (max-width: 1080px) {
      #main-window {
        width: 95vw;
        height: 95vh;
      }
 
      #sidebar {
        display: none;
      }
 
      .return-button {
        display: block;
      }
 
      #menu-bar {
        display: none;
      }
    }
 
    @media screen and (max-width: 600px) {
      #films-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }
 
      .poster-wrapper {
        width: 95px;
        height: 140px;
      }
 
      .film-title {
        width: 95px;
        font-size: 10px;
      }
 
      #popup-window {
        width: 95vw;
      }
    }
  </style>
</head>
<body>
 
  <div id="main-window">
    <!-- TITLE BAR -->

        <img src="cd_audio.png" alt="" onerror="this.style.display='none'" />

      </div>
      <div class="title-bar-buttons">
        <button class="tb-btn">_</button>
        <button class="tb-btn">□</button>
        <button class="tb-btn" onclick="window.location.href='home.html'">✕</button>
      </div>
    </div>
 
    <!-- MENU BAR -->
    <div id="menu-bar">
      <button class="return-button" onclick="window.location.href='home.html'">← back</button>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Favorites</span>
      <span>Help</span>
    </div>
 
    <!-- ADDRESS BAR -->
    <div id="address-bar">
      <span>Address</span>
      <input id="address-input" type="text" value="C:\mwangi\films" readonly />
    </div>
 
    <!-- CONTENT -->
    <div id="content-area">
 
      <!-- SIDEBAR -->
      <div id="sidebar">
        <div>
          <div class="sidebar-section-title">📁 Pages</div>
          <a class="sidebar-item" href="home.html">🏠 home</a>
          <a class="sidebar-item" href="spotify.html">🎵 spotify</a>
          <a class="sidebar-item" href="films.html">🎬 films</a>
        </div>
 
        <div id="filter-section">
          <div class="sidebar-section-title">🎬 Filter</div>
          <button class="filter-btn active" onclick="filterFilms('all', this)">All Films</button>
          <button class="filter-btn" onclick="filterFilms(5, this)">★★★★★ Only</button>
          <button class="filter-btn" onclick="filterFilms(4, this)">★★★★ & up</button>
          <button class="filter-btn" onclick="filterFilms(3, this)">★★★ & up</button>
        </div>
 
        <div>
          <div class="sidebar-section-title">ℹ️ Info</div>
          <div style="font-size:10px; color:#444; line-height:1.5; padding: 2px 4px;">
            Click any poster to see details & add a review.
          </div>
        </div>
      </div>
 
      <!-- FILMS GRID -->
      <div id="films-area">
        <div id="films-grid"></div>
      </div>
    </div>
 
    <!-- STATUS BAR -->
    <div id="status-bar">
      <div class="status-box" id="status-text">Loading films...</div>
      <div class="status-box">mwangi.wav</div>
    </div>
  </div>
 
  <!-- POPUP -->
  <div id="popup-overlay">
    <div id="popup-window">
      <div id="popup-title-bar">
        <span id="popup-title-text">film details</span>
        <button id="popup-close" onclick="closePopup()">✕</button>
      </div>
      <div id="popup-body">
        <img id="popup-poster" src="" alt="poster" />
        <div id="popup-info">
          <div id="popup-film-title"></div>
          <div id="popup-year"></div>
          <div class="star-selector" id="popup-star-selector">
            <span data-val="1">★</span>
            <span data-val="2">★</span>
            <span data-val="3">★</span>
            <span data-val="4">★</span>
            <span data-val="5">★</span>
          </div>
          <div id="popup-overview"></div>
        </div>
      </div>
      <div id="popup-review-section">
        <div id="popup-review-label">my thoughts:</div>
        <div id="popup-review-text">no review yet.</div>
        <textarea id="popup-review-input" placeholder="write something about this film..."></textarea>
      </div>
      <div id="popup-btn-row">
        <button class="popup-btn" id="edit-review-btn" onclick="toggleReviewEdit()">edit review</button>
        <button class="popup-btn" onclick="saveAndClose()">OK</button>
      </div>
    </div>
  </div>
 
  <script>
    const TMDB_KEY = '2dcd13f1c5ac6ab16a268c5cd2a3e0c0';
    const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
 
    const FILMS = [
      { title: "Batman", query: "Batman 1989" },
      { title: "Sicario", query: "Sicario 2015" },
      { title: "Ready Player One", query: "Ready Player One 2018" },
      { title: "Gladiator II", query: "Gladiator II 2024" },
      { title: "It Follows", query: "It Follows 2014" },
      { title: "Tetris", query: "Tetris 2023" },
      { title: "Weapons", query: "Weapons 2024" },
      { title: "Dunkirk", query: "Dunkirk 2017" },
      { title: "Avatar: The Last Airbender", query: "Avatar Last Airbender 2025 film" },
      { title: "Parasite", query: "Parasite 2019 Bong Joon-ho" },
      { title: "Tenet", query: "Tenet 2020 Nolan" },
      { title: "BlacKkKlansman", query: "BlacKkKlansman 2018" },
      { title: "Prisoners", query: "Prisoners 2013" },
      { title: "Sinners", query: "Sinners 2025 film" },
      { title: "Mickey 17", query: "Mickey 17 2025" },
      { title: "Now You See Me 3", query: "Now You See Me 3 2025" },
    ];
 
    let filmData = [];
    let currentFilmIndex = null;
    let editingReview = false;
 
    // Load saved ratings & reviews from localStorage
    function getSaved() {
      try { return JSON.parse(localStorage.getItem('mwangi_films') || '{}'); } catch { return {}; }
    }
    function setSaved(data) {
      localStorage.setItem('mwangi_films', JSON.stringify(data));
    }
 
    async function fetchFilm(film) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(film.query)}&language=en-US`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const m = data.results[0];
          return {
            title: film.title,
            poster: m.poster_path ? TMDB_IMG + m.poster_path : null,
            year: m.release_date ? m.release_date.slice(0, 4) : '',
            overview: m.overview || '',
            tmdb_id: m.id
          };
        }
      } catch (e) {}
      return { title: film.title, poster: null, year: '', overview: '', tmdb_id: null };
    }
 
    function renderStars(rating) {
      const filled = '★'.repeat(rating);
      const empty = '☆'.repeat(5 - rating);
      return filled + empty;
    }
 
    function createCard(film, index) {
      const saved = getSaved();
      const rating = saved[film.title]?.rating || 0;
 
      const card = document.createElement('div');
      card.className = 'film-card';
      card.dataset.index = index;
      card.dataset.rating = rating;
 
      const wrapper = document.createElement('div');
      wrapper.className = 'poster-wrapper';
 
      if (film.poster) {
        const img = document.createElement('img');
        img.src = film.poster;
        img.alt = film.title;
        img.loading = 'lazy';
        wrapper.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'poster-placeholder';
        ph.textContent = film.title;
        wrapper.appendChild(ph);
      }
 
      const titleEl = document.createElement('div');
      titleEl.className = 'film-title';
      titleEl.textContent = film.title;
 
      const starsEl = document.createElement('div');
      starsEl.className = 'film-stars';
      starsEl.textContent = rating > 0 ? renderStars(rating) : '☆☆☆☆☆';
      starsEl.id = `stars-${index}`;
 
      card.appendChild(wrapper);
      card.appendChild(titleEl);
      card.appendChild(starsEl);
 
      card.addEventListener('click', () => openPopup(index));
 
      return card;
    }
 
    async function loadFilms() {
      const grid = document.getElementById('films-grid');
      const status = document.getElementById('status-text');
      grid.innerHTML = '';
      filmData = [];
 
      for (let i = 0; i < FILMS.length; i++) {
        status.textContent = `Loading ${i + 1} of ${FILMS.length}...`;
        const data = await fetchFilm(FILMS[i]);
        filmData.push(data);
        const card = createCard(data, i);
        grid.appendChild(card);
      }
 
      status.textContent = `${FILMS.length} films`;
    }
 
    function openPopup(index) {
      currentFilmIndex = index;
      const film = filmData[index];
      const saved = getSaved();
      const entry = saved[film.title] || {};
      const rating = entry.rating || 0;
      const review = entry.review || '';
 
      document.getElementById('popup-title-text').textContent = film.title;
      document.getElementById('popup-film-title').textContent = film.title;
      document.getElementById('popup-year').textContent = film.year || '';
      document.getElementById('popup-overview').textContent = film.overview || '';
      document.getElementById('popup-poster').src = film.poster || '';
      document.getElementById('popup-review-text').textContent = review || 'no review yet.';
      document.getElementById('popup-review-input').value = review;
      document.getElementById('popup-review-input').style.display = 'none';
      document.getElementById('popup-review-text').style.display = 'block';
      document.getElementById('edit-review-btn').textContent = 'edit review';
      editingReview = false;
 
      // Set stars
      const stars = document.querySelectorAll('#popup-star-selector span');
      stars.forEach(s => {
        s.classList.toggle('lit', parseInt(s.dataset.val) <= rating);
      });
 
      document.getElementById('popup-overlay').classList.add('visible');
    }
 
    function closePopup() {
      document.getElementById('popup-overlay').classList.remove('visible');
      currentFilmIndex = null;
    }
 
    function toggleReviewEdit() {
      editingReview = !editingReview;
      document.getElementById('popup-review-input').style.display = editingReview ? 'block' : 'none';
      document.getElementById('popup-review-text').style.display = editingReview ? 'none' : 'block';
      document.getElementById('edit-review-btn').textContent = editingReview ? 'cancel' : 'edit review';
    }
 
    function saveAndClose() {
      if (currentFilmIndex === null) { closePopup(); return; }
      const film = filmData[currentFilmIndex];
      const saved = getSaved();
      const stars = document.querySelectorAll('#popup-star-selector span');
      let rating = 0;
      stars.forEach(s => { if (s.classList.contains('lit')) rating = parseInt(s.dataset.val); });
      const review = editingReview
        ? document.getElementById('popup-review-input').value.trim()
        : (saved[film.title]?.review || '');
 
      saved[film.title] = { rating, review };
      setSaved(saved);
 
      // Update card
      const starsEl = document.getElementById(`stars-${currentFilmIndex}`);
      if (starsEl) starsEl.textContent = rating > 0 ? renderStars(rating) : '☆☆☆☆☆';
      const card = document.querySelector(`.film-card[data-index="${currentFilmIndex}"]`);
      if (card) card.dataset.rating = rating;
 
      closePopup();
    }
 
    // Star hover & click in popup
    document.querySelectorAll('#popup-star-selector span').forEach(star => {
      star.addEventListener('mouseover', () => {
        const val = parseInt(star.dataset.val);
        document.querySelectorAll('#popup-star-selector span').forEach(s => {
          s.classList.toggle('lit', parseInt(s.dataset.val) <= val);
        });
      });
      star.addEventListener('click', () => {
        const val = parseInt(star.dataset.val);
        document.querySelectorAll('#popup-star-selector span').forEach(s => {
          s.classList.toggle('lit', parseInt(s.dataset.val) <= val);
        });
      });
    });
 
    document.getElementById('popup-star-selector').addEventListener('mouseleave', () => {
      // find current selected
      const saved = getSaved();
      if (currentFilmIndex === null) return;
      const film = filmData[currentFilmIndex];
      const rating = saved[film?.title]?.rating || 0;
      document.querySelectorAll('#popup-star-selector span').forEach(s => {
        s.classList.toggle('lit', parseInt(s.dataset.val) <= rating);
      });
    });
 
    // Click outside popup closes it
    document.getElementById('popup-overlay').addEventListener('click', function(e) {
      if (e.target === this) closePopup();
    });
 
    function filterFilms(minRating, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.film-card').forEach(card => {
        const r = parseInt(card.dataset.rating) || 0;
        if (minRating === 'all') {
          card.style.display = '';
        } else {
          card.style.display = r >= minRating ? '' : 'none';
        }
      });
    }
 
    loadFilms();
  </script>
</body>
</html>
