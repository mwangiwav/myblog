<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>films</title>
    <style>
      #film-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 16px;
        margin-top: 14px;
      }

      .film-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }

      .poster {
        width: 150px;
        height: 222px;
        background: #c0c0c0;
        box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .poster-placeholder {
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(
          45deg,
          #b8b8b8 0px, #b8b8b8 1px,
          #c8c8c8 1px, #c8c8c8 6px
        );
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .poster-placeholder span {
        font-size: 9px;
        color: #888;
        text-align: center;
        padding: 4px;
        background: rgba(255,255,255,0.6);
        line-height: 1.4;
      }

      .film-card:hover .poster {
        outline: 2px solid #86a1f1;
      }

      .card-title {
        font-size: 11px;
        text-align: center;
        width: 150px;
        word-break: break-word;
        line-height: 1.3;
      }

      .card-stars {
        font-size: 13px;
        color: #DAA520;
        letter-spacing: 1px;
      }

      #popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.25);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      #popup-overlay.visible { display: flex; }

      #popup {
        width: 340px;
        background: silver;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        font-family: "Pixelated MS Sans Serif", Arial;
      }

      #popup-titlebar {
        background: linear-gradient(90deg, #86a1f1, #e8bfe4);
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px;
      }

      #popup-titlebar span {
        font-size: 12px;
        font-weight: 700;
        color: white;
        text-shadow: 1px 1px #0a0a0a;
      }

      #popup-close {
        width: 16px;
        height: 14px;
        background: silver;
        border: none;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        font-size: 10px;
        font-family: "Pixelated MS Sans Serif", Arial;
        cursor: pointer;
      }

      #popup-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #popup-film-name {
        font-size: 13px;
        font-weight: 700;
      }

      #popup-stars {
        font-size: 22px;
        color: #DAA520;
        letter-spacing: 2px;
      }

      #review-label { font-size: 11px; font-weight: 700; }

      #review-display {
        font-size: 11px;
        color: #444;
        font-style: italic;
        min-height: 28px;
        padding: 4px 6px;
        background: white;
        box-shadow: inset -1px -1px #fff, inset 1px 1px grey, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      }

      #popup-btns {
        display: flex;
        justify-content: flex-end;
        padding: 0 12px 12px;
      }

      .pop-btn {
        background: silver;
        border: none;
        box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        font-family: "Pixelated MS Sans Serif", Arial;
        font-size: 11px;
        padding: 4px 14px;
        cursor: pointer;
        min-width: 72px;
      }

      .pop-btn:hover { background: #dfdfdf; }
    </style>
  </head>
  <body>
    <h3>watched films in 2026</h3>

    <div id="film-grid"></div>

    <div id="popup-overlay">
      <div id="popup">
        <div id="popup-titlebar">
          <span id="popup-title-text">film</span>
          <button id="popup-close" onclick="closePopup()">✕</button>
        </div>
        <div id="popup-body">
          <div id="popup-film-name"></div>
          <div id="popup-stars"></div>
          <div id="review-label">my thoughts:</div>
          <div id="review-display"></div>
        </div>
        <div id="popup-btns">
          <button class="pop-btn" onclick="closePopup()">OK</button>
        </div>
      </div>
    </div>

    <script>
      const FILMS = [
        { title: "Batman",                     poster: "https://posters.movieposterdb.com/22_05/2022/1877830/l_1877830_f55aded0.jpg",  rating: 4, review: "" },
        { title: "Sicario",                    poster: "https://posters.movieposterdb.com/15_10/2015/3397884/l_429c1de5.jpg",  rating: 4, review: "" },
        { title: "Ready Player One",           poster: "https://posters.movieposterdb.com/20_06/2018/1677720/l_1677720_376c9e0b.jpg", rating: 5, review: "" },
        { title: "Gladiator II",               poster: "https://posters.movieposterdb.com/24_09/2024/9218128/l_gladiator-ii-movie-poster_c9934359.jpg", rating: 3, review: "" },
        { title: "It Follows",                 poster: "https://posters.movieposterdb.com/15_04/2014/3235888/l_3235888_42ed86b6.jpg",  rating: 2, review: "Dry aah dialogue" },
        { title: "Tetris",                     poster: "https://posters.movieposterdb.com/23_03/2023/12758060/l_tetris-movie-poster_f0531b01.jpg", rating: 4, review: "Tetris is that serious" },
        { title: "Weapons",                    poster: "https://posters.movieposterdb.com/25_04/2025/26581740/l_weapons-movie-poster_b9cfd5c6.jpg", rating: 3, review: "Ass cheeks ending" },
        { title: "Dunkirk",                    poster: "https://posters.movieposterdb.com/23_02/2017/5013056/l_dunkirk-movie-poster_4e89cfce.jpg", rating: 3, review: "" },
        { title: "Avatar: The Last Airbender", poster: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnekLKFeBgQlWfGgoX1aEN-_nrQLodBdNpOw&s", rating: 4, review: "" },
        { title: "Parasite",                   poster: "https://posters.movieposterdb.com/21_11/2019/6751668/l_6751668_0d0409c5.jpg", rating: 4, review: "" },
        { title: "Tenet",                      poster: "https://posters.movieposterdb.com/20_09/2020/6723592/l_6723592_46561c38.jpg", rating: 5, review: "Still don't know wtf happened" },
        { title: "BlacKkKlansman",             poster: "https://posters.movieposterdb.com/20_01/2018/7349662/l_7349662_64722860.jpg", rating: 4, review: "" },
        { title: "Prisoners",                  poster: "https://posters.movieposterdb.com/15_03/2013/1392214/l_1392214_7c2f784a.jpg", rating: 3, review: "" },
        { title: "Sinners",                    poster: "https://posters.movieposterdb.com/25_04/2025/31193180/l_sinners-movie-poster_3fa9e5fc.jpg", rating: 4, review: "" },
        { title: "Mickey 17",                  poster: "https://posters.movieposterdb.com/25_01/2025/12299608/l_mickey-17-movie-poster_97f35750.jpg", rating: 4, review: "" },
        { title: "Now You See Me 3",           poster: "https://posters.movieposterdb.com/25_09/2025/4712810/l_now-you-see-me-now-you-dont-movie-poster_5fdbc32f.jpg", rating: 3, review: "" },
        { title: "Everything Everywhere All at Once",  poster: "https://posters.movieposterdb.com/22_04/2/6710474/l_6710474_7ad8ab0d.jpg",  rating: 4, review: "ABSOLUTE CINEMA" },
        { title: "All Quiet on the Western Front", poster: "https://posters.movieposterdb.com/23_02/2022/1016150/l_im-westen-nichts-neues-movie-poster_6463e0ab.jpg", rating: 5, review: "and some nigga convinced them to try again bruh" },
      ];

      let currentFilm = null;

      function renderStars(r) {
        if (!r) return '☆☆☆☆☆';
        return '★'.repeat(r) + '☆'.repeat(5 - r);
      }

      function buildGrid() {
        const grid = document.getElementById('film-grid');
        grid.innerHTML = '';
        FILMS.forEach(film => {
          const card = document.createElement('div');
          card.className = 'film-card';

          const poster = document.createElement('div');
          poster.className = 'poster';

          if (film.poster) {
            const img = document.createElement('img');
            img.src = film.poster;
            img.alt = film.title;
            poster.appendChild(img);
          } else {
            const ph = document.createElement('div');
            ph.className = 'poster-placeholder';
            ph.innerHTML = '<span>no poster<br>yet</span>';
            poster.appendChild(ph);
          }

          const titleEl = document.createElement('div');
          titleEl.className = 'card-title';
          titleEl.textContent = film.title;

          const starsEl = document.createElement('div');
          starsEl.className = 'card-stars';
          starsEl.textContent = renderStars(film.rating);

          card.appendChild(poster);
          card.appendChild(titleEl);
          card.appendChild(starsEl);
          card.addEventListener('click', () => openPopup(film.title));
          grid.appendChild(card);
        });
      }

      function openPopup(title) {
        const film = FILMS.find(f => f.title === title);
        if (!film) return;
        currentFilm = title;

        document.getElementById('popup-title-text').textContent = title;
        document.getElementById('popup-film-name').textContent = title;
        document.getElementById('popup-stars').textContent = renderStars(film.rating);
        document.getElementById('review-display').textContent = film.review || 'no review yet.';
        document.getElementById('popup-overlay').classList.add('visible');
      }

      function closePopup() {
        document.getElementById('popup-overlay').classList.remove('visible');
        currentFilm = null;
      }

      document.getElementById('popup-overlay').addEventListener('click', function(e) {
        if (e.target === this) closePopup();
      });

      buildGrid();
    </script>
    <a href="home.html">← back</a>
     <div id="footer" style="text-align: center"></div>
    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
