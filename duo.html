<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css"/>
    <link rel="stylesheet" href="duo.css"/>
    <title>Gng</title>
  </head>
  <body>
    <h3>Gng</h3>
    <div id="header">This site requires JavaScript!</div>
    <div id="content">

      <div class="ig-carousel" id="gngCarousel">
        <div class="ig-slides">
          <div class="ig-slide active">
            <img src="gang.JPG" alt=""/>
          </div>
          <div class="ig-slide">
            <img src="gng.gif" alt=""/>
          </div>
          <!-- more ig-slide blocks go here as you add more photos -->
        </div>

        <button class="ig-arrow ig-prev" aria-label="previous">&#10094;</button>
        <button class="ig-arrow ig-next" aria-label="next">&#10095;</button>

        <div class="ig-dots">
          <button class="ig-dot active"></button>
          <button class="ig-dot"></button>
          <!-- one ig-dot per slide, same order -->
        </div>
      </div>

      <br>
      <a href="gng.html">← back</a>

    </div>

    <div id="footer" style="text-align: center"></div>
    <script src="script.js" type="text/javascript"></script>

    <script>
      (function() {
        var carousel = document.getElementById('gngCarousel');
        var slides = carousel.querySelectorAll('.ig-slide');
        var dots = carousel.querySelectorAll('.ig-dot');
        var current = 0;

        function goTo(index) {
          slides[current].classList.remove('active');
          dots[current].classList.remove('active');
          current = (index + slides.length) % slides.length;
          slides[current].classList.add('active');
          dots[current].classList.add('active');
        }

        carousel.querySelector('.ig-prev').addEventListener('click', function() {
          goTo(current - 1);
        });
        carousel.querySelector('.ig-next').addEventListener('click', function() {
          goTo(current + 1);
        });
        dots.forEach(function(dot, i) {
          dot.addEventListener('click', function() { goTo(i); });
        });

        var startX = 0;
        carousel.addEventListener('touchstart', function(e) {
          startX = e.touches[0].clientX;
        });
        carousel.addEventListener('touchend', function(e) {
          var diff = e.changedTouches[0].clientX - startX;
          if (diff > 50) goTo(current - 1);
          else if (diff < -50) goTo(current + 1);
        });
      })();
    </script>
  </body>
</html>
