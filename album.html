    <style>
      .masonry {
        columns: 2;
        column-gap: 8px;
        margin-top: 12px;
      }
 
      .masonry .poster-wrap {
        position: relative;
        display: block;
        margin-bottom: 8px;
        break-inside: avoid;
        cursor: url("win98-pointer.png"), pointer;
      }
 
      .masonry .poster-wrap img {
        width: 100%;
        display: block;
      }
 
      .album-label {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Pixelated MS Sans Serif", Arial;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
 
      .poster-wrap.active .album-label {
        opacity: 1;
        pointer-events: auto;
      }
 
      @media (min-width: 600px) {
        .masonry {
          columns: 3;
        }
      }
    </style>

    <script>
      document.querySelectorAll('.poster-wrap').forEach(function(wrap) {
        wrap.querySelector('.album-label').textContent = wrap.dataset.name;
 
        wrap.addEventListener('click', function() {
          var isActive = wrap.classList.contains('active');
          document.querySelectorAll('.poster-wrap.active').forEach(function(el) {
            el.classList.remove('active');
          });
          if (!isActive) wrap.classList.add('active');
        });
      });
 
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.poster-wrap')) {
          document.querySelectorAll('.poster-wrap.active').forEach(function(el) {
            el.classList.remove('active');
          });
        }
      });
    </script>
