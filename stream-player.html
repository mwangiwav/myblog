<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.16/dist/98.css" />
    <link rel="stylesheet" href="plain-blog-style.css"/>
    <link rel="stylesheet" href="yt.css"/>    
    <title>stream player</title>    
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="streams.html">← back to streams</a></p>
      <div id="player-layout">
 
        <div id="main-video">
          <div id="yt-player">
            <iframe
              id="yt-iframe"
              src=""
              allowfullscreen
              allow="autoplay; encrypted-media"
            ></iframe>
          </div>
 
          <div id="video-info">
            <p><strong id="video-title"></strong></p>
            <p style="color: grey;" id="video-meta"></p>
          </div>
        </div>
 
        <div id="playlist">
          <p><strong>up next</strong></p>
        </div>
 
      </div>

      <div class="window" style="margin-top: 20px; width: 100%; max-width: 500px;">
        <div class="title-bar">
          <div class="title-bar-text">comments.exe</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <p style="display: flex; gap: 8px; align-items: flex-start;">
            <img src="folder.png" alt="" style="width: 32px; height: 32px;" />
            <span>
              <strong>mwangi</strong> <span style="color: grey; font-size: 11px;">· pinned</span><br/>
             No more MC sessions for now my bum aah hb's excuse of a laptop died 🥀.
            </span>
          </p>
        </div>
      </div>

    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
    <script>
      const streams = [
        { title: "I'M ICEMAN", meta: "Mwangi", ytId: "_8jH7TTjImc" },
       ];
 
      let currentIndex = 0;
 
      const iframe = document.getElementById("yt-iframe");
      const videoTitle = document.getElementById("video-title");
      const videoMeta = document.getElementById("video-meta");
      const playlist = document.getElementById("playlist");
 
      function loadStream(index) {
        currentIndex = index;
        const stream = streams[index];
        iframe.src = `https://www.youtube.com/embed/${stream.ytId}?autoplay=1&rel=0`;
        videoTitle.textContent = stream.title;
        videoMeta.textContent = stream.meta;
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".playlist-item")[index].classList.add("active");
      }
 
      streams.forEach((stream, i) => {
        const item = document.createElement("div");
        item.className = "playlist-item";
        item.innerHTML = `<img src="folder.png" alt="stream"/><span>${stream.title}<br><span style="color:grey;">${stream.meta}</span></span>`;
        item.addEventListener("click", () => loadStream(i));
        playlist.appendChild(item);
      });
 
      loadStream(0);
    </script>
  </body>
</html>
