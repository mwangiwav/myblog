<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>stream player</title>
    <style>
      #player-layout {
        display: flex;
        gap: 20px;
      }
      #main-video { flex: 3; }
      #playlist {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .playlist-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        border-bottom: 1px solid #dfdfdf;
        cursor: url("win98-pointer.png"), pointer;
      }
      .playlist-item:hover { background: #dfdfdf; }
      .playlist-item.active { background: #dfdfdf; }
      .playlist-item img { width: 32px; height: 32px; }

      #video-wrapper {
        position: relative;
        background: #000;
        width: 100%;
      }
      #video-wrapper video {
        width: 100%;
        display: block;
      }

      #custom-controls {
        background: silver;
        border-top: 2px solid #fff;
        border-bottom: 2px solid grey;
        padding: 5px 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #seek-bar {
        width: 100%;
        height: 14px;
        cursor: url("win98-pointer.png"), pointer;
        accent-color: #86a1f1;
      }

      #controls-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #controls-row button {
        font-family: "Pixelated MS Sans Serif", Arial;
        font-size: 11px;
        cursor: url("win98-pointer.png"), pointer;
        min-width: 36px;
        padding: 2px 4px;
      }

      #volume-bar {
        width: 70px;
        height: 14px;
        accent-color: #86a1f1;
        cursor: url("win98-pointer.png"), pointer;
      }

      #time-display {
        font-size: 11px;
        font-family: "Pixelated MS Sans Serif", Arial;
        margin-left: auto;
        white-space: nowrap;
      }

      #video-info { margin-top: 8px; }
      #video-info p { margin: 3px 0; }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="streams.html">← back to streams</a></p>
      <div id="player-layout">

        <div id="main-video">
          <div id="video-wrapper">
            <video id="player" src=""></video>
          </div>
          <div id="custom-controls">
            <input id="seek-bar" type="range" value="0" min="0" step="0.1"/>
            <div id="controls-row">
              <button onclick="prevStream()">⏮</button>
              <button onclick="rewind()">-10s</button>
              <button id="play-btn" onclick="togglePlay()">▶</button>
              <button onclick="skipForward()">+10s</button>
              <button onclick="nextStream()">⏭</button>
              <input id="volume-bar" type="range" min="0" max="1" step="0.05" value="1"/>
              <span id="time-display">0:00 / 0:00</span>
            </div>
          </div>
          <div id="video-info">
            <p><strong id="video-title"></strong></p>
            <p style="color: grey;" id="video-meta"></p>
          </div>
        </div>

        <div id="playlist">
          <p><strong>up next</strong></p>
        </div>

      </div>
    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
    <script>
      const streams = [
        { title: "session_01", meta: "May 2026 — survival world", src: "https://file.garden/adsn6IDutmhqKH5B/test.mp4" },
        { title: "session_02", meta: "May 2026 — survival world", src: "YOUR_FILE_GARDEN_LINK_2" },
        { title: "session_03", meta: "May 2026 — survival world", src: "YOUR_FILE_GARDEN_LINK_3" }
      ];

      let currentIndex = 0;
      const player = document.getElementById("player");
      const playBtn = document.getElementById("play-btn");
      const seekBar = document.getElementById("seek-bar");
      const volumeBar = document.getElementById("volume-bar");
      const timeDisplay = document.getElementById("time-display");
      const videoTitle = document.getElementById("video-title");
      const videoMeta = document.getElementById("video-meta");
      const playlist = document.getElementById("playlist");

      function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, "0");
        return `${m}:${sec}`;
      }

      function loadStream(index) {
        currentIndex = index;
        const stream = streams[index];
        player.src = stream.src;
        player.load();
        player.play();
        playBtn.textContent = "⏸";
        videoTitle.textContent = stream.title;
        videoMeta.textContent = stream.meta;
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".playlist-item")[index].classList.add("active");
      }

      function togglePlay() {
        if (player.paused) { player.play(); playBtn.textContent = "⏸"; }
        else { player.pause(); playBtn.textContent = "▶"; }
      }

      function rewind() { player.currentTime = Math.max(0, player.currentTime - 10); }
      function skipForward() { player.currentTime = Math.min(player.duration, player.currentTime + 10); }
      function prevStream() { if (currentIndex > 0) loadStream(currentIndex - 1); }
      function nextStream() { if (currentIndex < streams.length - 1) loadStream(currentIndex + 1); }

      player.addEventListener("timeupdate", () => {
        if (player.duration) {
          seekBar.max = player.duration;
          seekBar.value = player.currentTime;
          timeDisplay.textContent = `${formatTime(player.currentTime)} / ${formatTime(player.duration)}`;
        }
      });

      seekBar.addEventListener("input", () => { player.currentTime = seekBar.value; });
      volumeBar.addEventListener("input", () => { player.volume = volumeBar.value; });
      player.addEventListener("ended", () => nextStream());

      streams.forEach((stream, i) => {
        const item = document.createElement("div");
        item.className = "playlist-item";
        item.innerHTML = `<img src="folder.png" alt="stream"/><span>${stream.title}<br><span style="color:grey;">${stream.meta}</span></span>`;
        item.addEventListener("click", () => loadStream(i));
        playlist.appendChild(item);
      });

      loadStream(0);
    </script>
  </body>
</html>
