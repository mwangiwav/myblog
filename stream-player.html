<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>stream player</title>
    <style>
      #player-layout { display: flex; gap: 20px; }
      #main-video { flex: 3; }
      #playlist { flex: 1; display: flex; flex-direction: column; gap: 5px; }

      .playlist-item {
        display: flex; align-items: center; gap: 8px;
        padding: 5px; border-bottom: 1px solid #dfdfdf;
        cursor: url("win98-pointer.png"), pointer;
      }
      .playlist-item:hover, .playlist-item.active { background: #dfdfdf; }
      .playlist-item img { width: 32px; height: 32px; }

     #yt-player {
  position: relative;
  background: #000;
  width: 100%;
  aspect-ratio: 16 / 9;
  cursor: pointer;
  user-select: none;
}
       #yt-player video { width: 100%; height: 100%; display: block; object-fit: contain; }

      #yt-controls {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(transparent, rgba(0,0,0,0.85));
        padding: 30px 10px 8px 10px;
        opacity: 1;
        transition: opacity 0.3s;
      }
      #yt-player.hide-controls #yt-controls { opacity: 0; }

      #progress-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.3);
        position: relative;
        margin-bottom: 8px;
        cursor: pointer;
        border-radius: 2px;
        transition: height 0.1s;
      }
      #progress-container:hover { height: 6px; }
      #progress-buffered {
        position: absolute; top: 0; left: 0; height: 100%;
        background: rgba(255,255,255,0.4);
        border-radius: 2px; pointer-events: none;
      }
      #progress-fill {
        position: absolute; top: 0; left: 0; height: 100%;
        background: #86a1f1;
        border-radius: 2px; pointer-events: none;
      }
      #progress-thumb {
        position: absolute; top: 50%;
        width: 12px; height: 12px;
        background: #86a1f1;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.1s;
        pointer-events: none;
      }
      #progress-container:hover #progress-thumb { transform: translate(-50%, -50%) scale(1); }

      #controls-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
      }
      .yt-btn {
        background: none; border: none; color: #fff;
        font-size: 16px; cursor: url("win98-pointer.png"), pointer;
        padding: 2px 4px; display: flex; align-items: center;
        font-family: "Pixelated MS Sans Serif", Arial;
      }
      .yt-btn:hover { color: #ccc; }

      #volume-wrap { display: flex; align-items: center; gap: 4px; }
      #volume-slider {
        width: 0; overflow: hidden; transition: width 0.2s;
        -webkit-appearance: none; appearance: none;
        height: 4px; background: rgba(255,255,255,0.3);
        outline: none; border-radius: 2px;
        accent-color: #86a1f1;
      }
      #volume-wrap:hover #volume-slider { width: 60px; }

      #time-wrap {
        font-size: 12px;
        font-family: "Pixelated MS Sans Serif", Arial;
        color: #fff;
        white-space: nowrap;
      }

      #right-controls { margin-left: auto; display: flex; gap: 4px; align-items: center; }

      #autoplay-btn {
        font-size: 11px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 2px;
        padding: 2px 6px;
        color: #fff;
        cursor: url("win98-pointer.png"), pointer;
        font-family: "Pixelated MS Sans Serif", Arial;
        white-space: nowrap;
      }
      #autoplay-btn:hover { background: rgba(255,255,255,0.25); }

      #video-info { margin-top: 8px; }
      #video-info p { margin: 3px 0; }

      #play-overlay {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: rgba(0,0,0,0.6);
        border-radius: 50%;
        width: 60px; height: 60px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; color: #fff;
        pointer-events: none;
        transition: transform 0.1s, opacity 0.3s;
        opacity: 0;
      }
      #play-overlay.show {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="streams.html">← back to streams</a></p>
      <div id="player-layout">

        <div id="main-video">
          <div id="yt-player">
            <video id="player" src="" preload="metadata"></video>

            <div id="play-overlay"></div>

            <div id="yt-controls">
              <div id="progress-container">
                <div id="progress-buffered"></div>
                <div id="progress-fill"></div>
                <div id="progress-thumb"></div>
              </div>
              <div id="controls-row">
                <button class="yt-btn" id="play-btn" title="Play/Pause">▶</button>
                <button class="yt-btn" onclick="prevStream()" title="Previous">⏮</button>
                <button class="yt-btn" onclick="rewind()" title="-10s">↺ 10</button>
                <button class="yt-btn" onclick="skipForward()" title="+10s">↻ 10</button>
                <button class="yt-btn" onclick="nextStream()" title="Next">⏭</button>
                <div id="volume-wrap">
                  <button class="yt-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
                  <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1"/>
                </div>
                <span id="time-wrap">0:00 / 0:00</span>
                <div id="right-controls">
                  <button id="autoplay-btn" onclick="toggleAutoplay()">autoplay: on</button>
                  <button class="yt-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
                </div>
              </div>
            </div>
          </div>

          <div id="video-info">
            <p><strong id="video-title"></strong></p>
            <p style="color: grey;" id="video-meta"></p>
          </div>
        </div>

        <div id="playlist">
          <p><strong>up next</strong></p>
        </div>

      </div>
    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
    <script>
      const streams = [
        { title: "session_01", meta: "May 2026 — survival world", src: "YOUR_FILE_GARDEN_LINK_1" },
        { title: "session_02", meta: "May 2026 — survival world", src: "YOUR_FILE_GARDEN_LINK_2" },
        { title: "session_03", meta: "May 2026 — survival world", src: "YOUR_FILE_GARDEN_LINK_3" }
      ];

      let currentIndex = 0;
      let autoplay = true;

      const player = document.getElementById("player");
      const ytPlayer = document.getElementById("yt-player");
      const playBtn = document.getElementById("play-btn");
      const muteBtn = document.getElementById("mute-btn");
      const volumeSlider = document.getElementById("volume-slider");
      const timeWrap = document.getElementById("time-wrap");
      const progressFill = document.getElementById("progress-fill");
      const progressBuffered = document.getElementById("progress-buffered");
      const progressThumb = document.getElementById("progress-thumb");
      const progressContainer = document.getElementById("progress-container");
      const playOverlay = document.getElementById("play-overlay");
      const videoTitle = document.getElementById("video-title");
      const videoMeta = document.getElementById("video-meta");
      const playlist = document.getElementById("playlist");
      const autoplayBtn = document.getElementById("autoplay-btn");

      let hideTimer;

      function formatTime(s) {
        if (isNaN(s)) return "0:00";
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, "0");
        return `${m}:${sec}`;
      }

      function loadStream(index) {
        currentIndex = index;
        const stream = streams[index];
        player.src = stream.src;
        player.load();
        player.play();
        playBtn.textContent = "⏸";
        videoTitle.textContent = stream.title;
        videoMeta.textContent = stream.meta;
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".playlist-item")[index].classList.add("active");
      }

      function togglePlay() {
        if (player.paused) {
          player.play();
          playBtn.textContent = "⏸";
          flashOverlay("⏸");
        } else {
          player.pause();
          playBtn.textContent = "▶";
          flashOverlay("▶");
        }
      }

      function flashOverlay(icon) {
        playOverlay.textContent = icon;
        playOverlay.classList.add("show");
        setTimeout(() => playOverlay.classList.remove("show"), 500);
      }

      function rewind() { player.currentTime = Math.max(0, player.currentTime - 10); }
      function skipForward() { player.currentTime = Math.min(player.duration, player.currentTime + 10); }
      function prevStream() { if (currentIndex > 0) loadStream(currentIndex - 1); }
      function nextStream() { if (currentIndex < streams.length - 1) loadStream(currentIndex + 1); }

      function toggleMute() {
        player.muted = !player.muted;
        muteBtn.textContent = player.muted ? "🔇" : "🔊";
      }

      function toggleAutoplay() {
        autoplay = !autoplay;
        autoplayBtn.textContent = autoplay ? "autoplay: on" : "autoplay: off";
        autoplayBtn.style.background = autoplay ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.05)";
        autoplayBtn.style.color = autoplay ? "#fff" : "rgba(255,255,255,0.4)";
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) ytPlayer.requestFullscreen();
        else document.exitFullscreen();
      }

      player.addEventListener("timeupdate", () => {
        if (!player.duration) return;
        const pct = (player.currentTime / player.duration) * 100;
        progressFill.style.width = pct + "%";
        progressThumb.style.left = pct + "%";
        timeWrap.textContent = `${formatTime(player.currentTime)} / ${formatTime(player.duration)}`;
      });

      player.addEventListener("progress", () => {
        if (player.buffered.length && player.duration) {
          const buffered = (player.buffered.end(player.buffered.length - 1) / player.duration) * 100;
          progressBuffered.style.width = buffered + "%";
        }
      });

      player.addEventListener("ended", () => {
        if (autoplay) nextStream();
      });

      progressContainer.addEventListener("click", (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        player.currentTime = ratio * player.duration;
      });

      volumeSlider.addEventListener("input", () => { player.volume = volumeSlider.value; });

      ytPlayer.addEventListener("click", (e) => {
        if (e.target === player || e.target === ytPlayer) togglePlay();
      });

      playBtn.addEventListener("click", togglePlay);

      ytPlayer.addEventListener("mousemove", () => {
        ytPlayer.classList.remove("hide-controls");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!player.paused) ytPlayer.classList.add("hide-controls");
        }, 3000);
      });

      ytPlayer.addEventListener("mouseleave", () => {
        if (!player.paused) ytPlayer.classList.add("hide-controls");
      });

      streams.forEach((stream, i) => {
        const item = document.createElement("div");
        item.className = "playlist-item";
        item.innerHTML = `<img src="folder.png" alt="stream"/><span>${stream.title}<br><span style="color:grey;">${stream.meta}</span></span>`;
        item.addEventListener("click", () => loadStream(i));
        playlist.appendChild(item);
      });

      loadStream(0);
    </script>
  </body>
</html>
