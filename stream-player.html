<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>stream player</title>
    <style>
      #player-layout {
        display: flex;
        gap: 20px;
      }
      #main-video {
        flex: 3;
      }
      #main-video video {
        width: 100%;
      }
      #main-video p {
        margin: 5px 0;
      }
      #playlist {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .playlist-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        border-bottom: 1px solid #dfdfdf;
        cursor: url("win98-pointer.png"), pointer;
      }
      .playlist-item:hover {
        background: #dfdfdf;
      }
      .playlist-item.active {
        background: #dfdfdf;
      }
      .playlist-item img {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="streams.html">← back to streams</a></p>
      <div id="player-layout">

        <div id="main-video">
          <video id="player" controls src="https://file.garden/adsn6IDutmhqKH5B/test.mp4">
            Your browser does not support video.
          </video>
          <p><strong id="video-title"></strong></p>
          <p style="color: grey;" id="video-meta"></p>
        </div>

        <div id="playlist">
          <p><strong>up next</strong></p>
        </div>

      </div>
    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
    <script>
      const streams = [
        {
          title: "session_01",
          meta: "May 2026 — survival world",
          src: "YOUR_FILE_GARDEN_LINK_1"
        },
        {
          title: "session_02",
          meta: "May 2026 — survival world",
          src: "YOUR_FILE_GARDEN_LINK_2"
        },
        {
          title: "session_03",
          meta: "May 2026 — survival world",
          src: "YOUR_FILE_GARDEN_LINK_3"
        }
      ];

      const player = document.getElementById("player");
      const videoTitle = document.getElementById("video-title");
      const videoMeta = document.getElementById("video-meta");
      const playlist = document.getElementById("playlist");

      function loadStream(index) {
        const stream = streams[index];
        player.src = stream.src;
        player.load();
        player.play();
        videoTitle.textContent = stream.title;
        videoMeta.textContent = stream.meta;
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".playlist-item")[index].classList.add("active");
      }

      streams.forEach((stream, i) => {
        const item = document.createElement("div");
        item.className = "playlist-item";
        item.innerHTML = `<img src="folder.png" alt="stream"/><span>${stream.title}<br><span style="color:grey;">${stream.meta}</span></span>`;
        item.addEventListener("click", () => loadStream(i));
        playlist.appendChild(item);
      });

      loadStream(0);
    </script>
  </body>
</html>
