<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="site.js" defer></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>stream player</title>
    <style>
      #player-layout {
        display: flex;
        gap: 20px;
      }
      #main-video {
        flex: 3;
      }
      #main-video video {
        width: 100%;
      }
      #main-video p {
        margin: 5px 0;
      }
      #playlist {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .playlist-item {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: inherit;
        padding: 5px;
        border-bottom: 1px solid #dfdfdf;
      }
      .playlist-item:hover {
        background: #dfdfdf;
      }
      .playlist-item span:first-child {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">mwangi's blog</h2>
    <div id="header"></div>
    <div id="content">
      <p><a href="streams.html">← back to streams</a></p>
      <div id="player-layout">

        <div id="main-video">
          <video controls src="">
            Your browser does not support video.
          </video>
          <p><strong>session_01</strong></p>
          <p style="color: grey;">May 2026 — survival world</p>
        </div>

        <div id="playlist">
          <p><strong>up next</strong></p>
          <a class="playlist-item" href="stream-player-02.html">
            <span>🎮</span>
            <span>session_02<br><span style="color: grey;">May 2026</span></span>
          </a>
          <a class="playlist-item" href="stream-player-03.html">
            <span>🎮</span>
            <span>session_03<br><span style="color: grey;">May 2026</span></span>
          </a>
        </div>

      </div>
    </div>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js"></script>
  </body>
</html>
