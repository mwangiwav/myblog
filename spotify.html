<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>spotify — mwangi's blog</title>
  </head>
  <body>
    <div id="header">This site requires JavaScript!</div>
    <div id="content">
      <h3>mwangi's playlist</h3>

      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;">

        <!-- Spotify window -->
        <div style="
          width: 500px;
          background: silver;
          box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        ">
          <div style="
            background: linear-gradient(90deg, #86a1f1, #e8bfe4);
            color: white;
            font-family: 'Pixelated MS Sans Serif', Arial;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 5px;
          ">
            <img src="cd_small.png" style="height: 14px;"/> mwangi's playlist
          </div>
          <div style="padding: 4px;">
            <iframe
              src="https://open.spotify.com/embed/playlist/2n03dPvOuIk6q8pYU6xJFt?utm_source=generator"
              width="100%"
              height="352"
              frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>
            <p style="
              font-family: 'Pixelated MS Sans Serif', Arial;
              font-size: 11px;
              color: #444;
              margin: 4px 2px 0;
            ">
              showing 100 of 1,200+ songs — <a href="https://open.spotify.com/playlist/2n03dPvOuIk6q8pYU6xJFt" target="_blank">open full playlist on Spotify</a>
            </p>
          </div>
        </div>

        <!-- Video window -->
        <div style="
          width: 260px;
          background: silver;
          box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        ">
          <div style="
            background: linear-gradient(90deg, #86a1f1, #e8bfe4);
            color: white;
            font-family: 'Pixelated MS Sans Serif', Arial;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
          ">
            you can tell a lot about a person...
          </div>
          <div style="padding: 4px;">
            <iframe
              width="100%"
              height="450"
              src="https://youtube.com/shorts/fZl6K1Pyj0Y?feature=share"
              title="Begin Again scene"
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              loading="lazy"
              allowfullscreen>
            </iframe>
            <p style="
              font-family: 'Pixelated MS Sans Serif', Arial;
              font-size: 11px;
              color: #444;
              margin: 4px 2px 0;
            ">
              Begin Again (2013)
            </p>
          </div>
        </div>

      </div>
    </div>
    <br>
    <a href="home.html">← back</a>
    <div id="footer" style="text-align: center"></div>
    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
