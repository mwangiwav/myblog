<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>spotify — mwangi's blog</title>
  </head>
  <body>
    <div id="header">This site requires JavaScript!</div>
    <div id="content">
      <h3>mwangi's playlist</h3>

      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;">

        <!-- Spotify window -->
        <div style="
          width: 500px;
          background: silver;
          box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        ">
          <div style="
            background: linear-gradient(90deg, #86a1f1, #e8bfe4);
            color: white;
            font-family: 'Pixelated MS Sans Serif', Arial;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 5px;
          ">
            <img src="cd_small.png" style="height: 14px;"/> mwangi's playlist
          </div>
          <div style="padding: 4px;">
            <iframe
              src="https://open.spotify.com/embed/playlist/2n03dPvOuIk6q8pYU6xJFt?utm_source=generator"
              width="100%"
              height="352"
              frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>
            <p style="
              font-family: 'Pixelated MS Sans Serif', Arial;
              font-size: 11px;
              color: #444;
              margin: 4px 2px 0;
            ">
              showing 100 of 1,200+ songs — <a href="https://open.spotify.com/playlist/2n03dPvOuIk6q8pYU6xJFt" target="_blank">open full playlist on Spotify</a>
            </p>
          </div>
        </div>

        <!-- Video window, streams-style player -->
        <div style="
          width: 320px;
          background: silver;
          box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf;
        ">
          <div style="
            background: linear-gradient(90deg, #86a1f1, #e8bfe4);
            color: white;
            font-family: 'Pixelated MS Sans Serif', Arial;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
          ">
            clip
          </div>
          <div style="padding: 4px;">
            <iframe id="yt-iframe" width="100%" height="180" frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen>
            </iframe>
            <p id="video-title" style="
              font-family: 'Pixelated MS Sans Serif', Arial;
              font-size: 11px;
              font-weight: 700;
              margin: 4px 2px 0;
            "></p>
            <p id="video-meta" style="
              font-family: 'Pixelated MS Sans Serif', Arial;
              font-size: 11px;
              color: #444;
              margin: 0 2px;
            "></p>
            <div id="playlist" style="margin-top: 4px;"></div>
          </div>
        </div>

      </div>
    </div>
    <br>
    <a href="home.html">← back</a>
    <div id="footer" style="text-align: center"></div>

    <script>
      const streams = [
        { title: "you can tell a lot about a person...", meta: "Begin Again (2013)", ytId: "fZl6K1Pyj0Y" },
      ];

      let currentIndex = 0;

      const iframe = document.getElementById("yt-iframe");
      const videoTitle = document.getElementById("video-title");
      const videoMeta = document.getElementById("video-meta");
      const playlist = document.getElementById("playlist");

      function loadStream(index) {
        currentIndex = index;
        const stream = streams[index];
        iframe.src = `https://www.youtube.com/embed/${stream.ytId}?rel=0`;
        videoTitle.textContent = stream.title;
        videoMeta.textContent = stream.meta;
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".playlist-item")[index].classList.add("active");
      }

      streams.forEach((stream, i) => {
        const item = document.createElement("div");
        item.className = "playlist-item";
        item.innerHTML = `<img src="folder.png" alt="stream"/><span>${stream.title}<br><span style="color:grey;">${stream.meta}</span></span>`;
        item.addEventListener("click", () => loadStream(i));
        playlist.appendChild(item);
      });

      loadStream(0);
    </script>

    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
