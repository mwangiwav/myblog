<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <title>spotify — mwangi's blog</title>
    <style>
      /* ── Spotify Win98 Player ── */
      .spotify-win {
        display: inline-block;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        padding: 3px;
        width: 260px;
        font-family: "Pixelated MS Sans Serif", Arial;
        font-size: 11px;
      }
 
      /* Title bar */
      .spotify-win__titlebar {
        background: linear-gradient(90deg, #0f3b82, #5a8fe8);
        color: #fff;
        font-weight: 700;
        font-size: 11px;
        padding: 3px 4px 3px 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
        margin-bottom: 3px;
      }
 
      .spotify-win__titlebar-left {
        display: flex;
        align-items: center;
        gap: 5px;
      }
 
      /* Spotify icon in title bar — green circle with S */
      .spotify-win__icon {
        width: 14px;
        height: 14px;
        background: #1db954;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 900;
        color: #000;
        flex-shrink: 0;
        line-height: 1;
      }
 
      /* Win98 window control buttons */
      .spotify-win__controls {
        display: flex;
        gap: 2px;
      }
 
      .spotify-win__btn {
        width: 16px;
        height: 14px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        border: none;
        font-size: 9px;
        font-family: "Pixelated MS Sans Serif", Arial;
        font-weight: 700;
        cursor: url("win98-pointer.png"), pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: #000;
        line-height: 1;
      }
 
      /* Body of the window */
      .spotify-win__body {
        background: #c0c0c0;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
 
      /* Inset album art area */
      .spotify-win__art {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #fff;
        box-shadow:
          inset 1px 1px #0a0a0a,
          inset -1px -1px #fff,
          inset 2px 2px grey,
          inset -2px -2px #dfdfdf;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
 
      .spotify-win__art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
 
      .spotify-win__art-placeholder {
        width: 100%;
        height: 100%;
        background: #fff;
      }
 
      /* Heart + progress row */
      .spotify-win__meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
 
      .spotify-win__heart-row {
        display: flex;
        justify-content: flex-end;
      }
 
      .spotify-win__heart {
        width: 20px;
        height: 20px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        cursor: url("win98-pointer.png"), pointer;
      }
 
      /* Progress bar */
      .spotify-win__progress {
        width: 100%;
        height: 14px;
        background: #c0c0c0;
        box-shadow:
          inset 1px 1px #0a0a0a,
          inset -1px -1px #fff,
          inset 2px 2px grey,
          inset -2px -2px #dfdfdf;
        position: relative;
        overflow: hidden;
      }
 
      .spotify-win__progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 35%;
        background: #c0c0c0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
 
      /* The draggable thumb */
      .spotify-win__progress-thumb {
        width: 10px;
        height: 20px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        position: absolute;
        top: 50%;
        left: 35%;
        transform: translate(-50%, -50%);
        cursor: url("win98-pointer.png"), pointer;
      }
 
      /* Playback controls row */
      .spotify-win__playback {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
 
      .spotify-win__playback-btn {
        width: 32px;
        height: 28px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        border: none;
        cursor: url("win98-pointer.png"), pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-size: 12px;
        color: #000;
      }
 
      .spotify-win__playback-btn.play {
        width: 32px;
        height: 28px;
      }
 
      .spotify-win__playback-btn:active {
        box-shadow:
          inset 1px 1px #0a0a0a,
          inset -1px -1px #fff,
          inset 2px 2px grey,
          inset -2px -2px #dfdfdf;
      }
 
      /* Bottom row: queue + expand */
      .spotify-win__bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
 
      .spotify-win__bottom-btn {
        width: 28px;
        height: 24px;
        background: #c0c0c0;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px grey,
          inset 2px 2px #dfdfdf;
        border: none;
        cursor: url("win98-pointer.png"), pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #000;
      }
 
      .spotify-win__bottom-btn:active {
        box-shadow:
          inset 1px 1px #0a0a0a,
          inset -1px -1px #fff,
          inset 2px 2px grey,
          inset -2px -2px #dfdfdf;
      }
 
      /* Hidden iframe overlay — covers the whole player, transparent pointer */
      .spotify-win__iframe-overlay {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 0;
      }
 
      /* Actual embed lives below the visual player, hidden */
      .spotify-embed-hidden {
        display: none;
      }
 
      /* Wrapper keeps the visual player position:relative for overlay */
      .spotify-win-wrapper {
        position: relative;
        display: inline-block;
      }
 
      /* ── Page layout ── */
      #content {
        padding-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="header">This site requires JavaScript!</div>
    <div id="content">
      <h3>mwangi's playlist</h3>
 
      <div class="spotify-win-wrapper">
        <div class="spotify-win">
 
          <!-- Title bar -->
          <div class="spotify-win__titlebar">
            <div class="spotify-win__titlebar-left">
              <div class="spotify-win__icon">♫</div>
              Spotify
            </div>
            <div class="spotify-win__controls">
              <button class="spotify-win__btn" title="Minimize">_</button>
              <button class="spotify-win__btn" title="Maximize">□</button>
              <button class="spotify-win__btn" title="Close">✕</button>
            </div>
          </div>
 
          <!-- Body -->
          <div class="spotify-win__body">
 
            <!-- Album art inset box -->
            <div class="spotify-win__art">
              <div class="spotify-win__art-placeholder"></div>
            </div>
 
            <!-- Heart -->
            <div class="spotify-win__meta">
              <div class="spotify-win__heart-row">
                <div class="spotify-win__heart" id="heartBtn" title="Like">
                  🤍
                </div>
              </div>
 
              <!-- Progress bar -->
              <div class="spotify-win__progress">
                <div class="spotify-win__progress-fill"></div>
                <div class="spotify-win__progress-thumb"></div>
              </div>
            </div>
 
            <!-- Playback controls -->
            <div class="spotify-win__playback">
              <!-- Shuffle -->
              <button class="spotify-win__playback-btn" title="Shuffle">⇌</button>
              <!-- Prev -->
              <button class="spotify-win__playback-btn" title="Previous">⏮</button>
              <!-- Play -->
              <button class="spotify-win__playback-btn play" id="playBtn" title="Play/Pause">▶</button>
              <!-- Next -->
              <button class="spotify-win__playback-btn" title="Next">⏭</button>
              <!-- Repeat -->
              <button class="spotify-win__playback-btn" title="Repeat">↺</button>
            </div>
 
            <!-- Bottom row -->
            <div class="spotify-win__bottom">
              <button class="spotify-win__bottom-btn" title="Queue">▤</button>
              <button class="spotify-win__bottom-btn" title="Open in Spotify" id="openSpotify">↗</button>
            </div>
 
          </div>
        </div>
      </div>
 
      <!-- The actual Spotify embed, hidden but present -->
      <div class="spotify-embed-hidden">
        <iframe
          id="spotifyEmbed"
          src="https://open.spotify.com/embed/playlist/0aHRDy0H2CZVJLmPbgFvRw?utm_source=generator"
          width="300"
          height="352"
          frameBorder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
 
    </div>
 
    <br>
    <a href="home.html">← back</a>
    <div id="footer" style="text-align: center"></div>
 
    <script>
      // Heart toggle — purely visual
      const heartBtn = document.getElementById('heartBtn');
      let liked = false;
      heartBtn.addEventListener('click', () => {
        liked = !liked;
        heartBtn.textContent = liked ? '💚' : '🤍';
      });
 
      // Play button toggle — purely visual
      const playBtn = document.getElementById('playBtn');
      let playing = false;
      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? '⏸' : '▶';
      });
 
      // Open in Spotify button
      document.getElementById('openSpotify').addEventListener('click', () => {
        window.open('https://open.spotify.com/playlist/0aHRDy0H2CZVJLmPbgFvRw', '_blank');
      });
    </script>
 
    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
