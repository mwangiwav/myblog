<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="plain-blog-style.css" />
    <link rel="stylesheet" href="spotify.css" />
    <title>spotify</title>
  </head>
  <body>
    <div id="header">This site requires JavaScript!</div>
    <div id="content">
      <h3>mwangi's playlist</h3>

      <div class="player-row">

        <!-- Spotify window -->
        <div class="spotify-window">
          <div class="spotify-titlebar">
            <img src="cd_small.png"/> mwangi's playlist
          </div>
          <div class="spotify-body">
            <iframe
              src="https://open.spotify.com/embed/playlist/2n03dPvOuIk6q8pYU6xJFt?utm_source=generator"
              width="100%"
              height="352"
              frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>
            <p class="spotify-caption">
              showing 100 of 1,200+ songs — <a href="https://open.spotify.com/playlist/2n03dPvOuIk6q8pYU6xJFt" target="_blank">open full playlist on Spotify</a>
            </p>
          </div>
        </div>

        <!-- Plain square video box, no chrome -->
        <iframe
          id="yt-iframe"
          class="video-frame"
          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>
    </div>
    <br>
    <a href="home.html">← back</a>
    <div id="footer" style="text-align: center"></div>

    <script>
      const ytId = "fZl6K1Pyj0Y";
      document.getElementById("yt-iframe").src = `https://www.youtube.com/embed/${ytId}?rel=0`;
    </script>

    <script src="script.js" type="text/javascript"></script>
  </body>
</html>
